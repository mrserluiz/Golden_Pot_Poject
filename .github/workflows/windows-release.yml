name: Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and builder
        run: python -m pip install . pyinstaller pillow

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build GoldenPot.exe
        run: python -m PyInstaller --noconfirm --clean GoldenPot.spec

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoldenPot-Windows
          path: dist/GoldenPot.exe
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GoldenPot.exe
          generate_release_notes: true
