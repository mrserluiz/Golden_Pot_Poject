name: GoldenPotScan Build
on:
  push:
    branches: [goldenpotscan-v0.0.1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: GoldenPotScan/pom.xml
      - name: Build
        working-directory: GoldenPotScan
        run: mvn -B -ntp clean package
      - uses: actions/upload-artifact@v4
        with:
          name: GoldenPotScan-v0.0.2-jar
          path: GoldenPotScan/target/*.jar
